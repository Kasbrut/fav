name: Release artifacts

# Tags publish signed Android and Linux packages; manual runs only upload artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check version matches the tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          test "$RELEASE_TAG" = "v$version" || { echo 'Tag must match pubspec.yaml version'; exit 1; }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Test server scripts
        run: sudo apt-get update && sudo apt-get install -y bats && bats test/scripts/*.bats
      - name: Build signed Android release artifacts
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FAV_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FAV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FAV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export FAV_KEYSTORE_PATH="$RUNNER_TEMP/fav-release.jks"
          trap 'rm -f -- "$FAV_KEYSTORE_PATH"' EXIT
          test -n "$KEYSTORE_BASE64" && test -n "$FAV_STORE_PASSWORD" && test -n "$FAV_KEY_ALIAS" && test -n "$FAV_KEY_PASSWORD" || {
            echo 'Configure the four Android signing secrets described in docs/building.md'; exit 1;
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FAV_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          ./scripts/build-android.sh
          ./scripts/build-android.sh --bundle
      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fav-release.jks"
      - name: Hash artifacts
        run: |
          mkdir -p build/releases/android
          cp build/app/outputs/flutter-apk/app*-release.apk build/releases/android/
          cp build/app/outputs/bundle/release/app-release.aab build/releases/android/
          cd build/releases/android
          sha256sum ./* > SHA256SUMS-android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fav-signed-android
          if-no-files-found: error
          path: |
            build/releases/android/*.apk
            build/releases/android/*.aab
            build/releases/android/SHA256SUMS-android

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check version matches the tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          test "$RELEASE_TAG" = "v$version" || { echo 'Tag must match pubspec.yaml version'; exit 1; }
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fav-linux-x64
          if-no-files-found: error
          path: build/releases/linux/*

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS-*
