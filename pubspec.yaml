name: fav
description: "Cross-platform Flutter app that provisions a Debian/Ubuntu server into a WireGuard VPN endpoint over SSH."
# This is an application, not a pub.dev library.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.7.0
  # App-level font package: Flutter framework/plugin code references
  # CupertinoIcons glyphs, so the app must bundle the font even when no
  # Cupertino widget is used directly (removing it breaks the icon build).
  cupertino_icons: ^2.0.0
  dart_zxcvbn: ^0.1.0+4
  dartssh2: ^4.1.0
  device_info_plus: ^13.3.0
  # Needs 12.x: the 11.x stable line pins win32 ^5 and conflicts with the *_plus
  # plugins (win32 ^6); 12.x also restored the Android "save" `bytes` arg that a
  # 12.0.0-beta dropped (which had written an empty .conf).
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_code_editor: ^0.3.2
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  highlight: ^0.7.0
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  logger: ^2.8.0
  meta: ^1.18.0
  package_info_plus: ^10.2.2
  posix: ^6.5.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  xterm: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0


flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generate localization sources (lib/l10n) from the ARB files.
  generate: true

  # Bundle the WireGuard installer scripts so the app can upload them to the
  # server. Asset directories are not recursive — each subdirectory is listed.
  assets:
    - lib/assets/help/faq/
    - lib/assets/help/firewall/
    - lib/assets/help/getting_started/
    - lib/assets/help/resources/
    - lib/assets/help/donate/
    - lib/assets/help/import/
    - lib/assets/scripts/
    - lib/assets/scripts/lib/
    - lib/assets/scripts/modules/
    - lib/assets/scripts/peers/
    - lib/assets/scripts/teardown/modules/

# App launcher icons — generate with `fvm dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#0d0a16"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
